[package]
name = "r2sync"
version = "0.0.6"
description = "cli for synchronizing files between a local directory and Cloudflare R2"
authors = ["Masayuki Matsuki <y.songmu@gmail.com>"]
categories = ["command-line-utilities"]
license = "MIT"
edition = "2021"
exclude = ["Makefile", "author/*"]
repository = "https://github.com/Songmu/r2sync"

[[bin]]
name = "r2sync"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
aws-sdk-s3 = { version = "1.157.0", features = ["behavior-version-latest"] }
aws-smithy-async = "1.3.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
md5 = "0.8.1"
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
mockall = "0.15.0"
