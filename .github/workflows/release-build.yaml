name: release build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          platform: linux_amd64
        - runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          platform: linux_arm64
        - runner: macos-15-intel
          target: x86_64-apple-darwin
          platform: darwin_amd64
        - runner: macos-15
          target: aarch64-apple-darwin
          platform: darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -C strip=symbols
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: setup Rust
      run: |
        rustup update stable --no-self-update
        rustup default stable
    - name: generate release credits
      run: |
        cargo install cargo-about --version 0.9.3 --locked --features cli
        make credits.html
    - name: build release archive
      env:
        TAG: ${{ github.ref_name }}
        TARGET: ${{ matrix.target }}
        PLATFORM: ${{ matrix.platform }}
      run: |
        version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "r2sync") | .version')
        test "$TAG" = "v$version"
        cargo build --release --locked --target "$TARGET"
        "target/$TARGET/release/r2sync" --help > /dev/null
        directory="dist/r2sync_${TAG}_${PLATFORM}"
        mkdir -p "$directory"
        cp "target/$TARGET/release/r2sync" "$directory/"
        ./author/dist.sh
    - name: attest build provenance
      uses: actions/attest@v4.2.2
      with:
        subject-path: |
          dist/*.tar.gz
          dist/*.zip
    - name: upload release archive
      uses: actions/upload-artifact@v7.0.2
      with:
        name: release-${{ github.run_id }}-archive-${{ matrix.platform }}
        path: |
          dist/*.tar.gz
          dist/*.zip
        if-no-files-found: error
        retention-days: 7
        overwrite: true

  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
    - name: download release archives
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: release-${{ github.run_id }}-archive-*
        merge-multiple: true
        path: release
    - name: generate release checksums
      working-directory: release
      run: sha256sum r2sync_*.tar.gz r2sync_*.zip > SHA256SUMS
    - name: attest checksum provenance
      uses: actions/attest@v4.2.2
      with:
        subject-path: release/SHA256SUMS
    - name: upload release checksums
      uses: actions/upload-artifact@v7.0.2
      with:
        name: release-${{ github.run_id }}-checksums
        path: release/SHA256SUMS
        if-no-files-found: error
        retention-days: 7
        overwrite: true
