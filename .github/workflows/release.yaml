name: release
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'tag'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-build.yaml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
    - name: download release artifacts
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: release-${{ github.run_id }}-*
        merge-multiple: true
        path: release
    - name: verify release checksums
      working-directory: release
      run: sha256sum --check SHA256SUMS
    - name: publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
          if [ "$draft" = false ]; then
            echo "Release $TAG is already published."
            exit 0
          fi
        else
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
        fi
        gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
