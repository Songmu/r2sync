name: tagpr
on:
  push:
    branches:
    - "main"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tagpr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: tagpr
      id: tagpr
      uses: Songmu/tagpr@v1.22.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: $/.github/actions/release
      with:
        tag: ${{ steps.tagpr.outputs.tag }}
        cargo_token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      if: "steps.tagpr.outputs.tag != ''"

  dispatch-release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: dispatch release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.tagpr.outputs.tag }}
      run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
